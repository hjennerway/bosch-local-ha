# Mirrors the bosch-local Dockge stack on 192.168.4.136.
# Requires Docker Compose 2.17+ for dockerfile_inline.
services:
  dishwasher:
    image: bosch-hcpy:590f1e7
    build:
      context: https://github.com/hcpy2-0/hcpy.git#590f1e71a75c91b36ea77eab7b5698c42ace4451
      dockerfile_inline: |
        FROM python:3.13-slim
        WORKDIR /app
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . ./
        CMD ["python3", "hc2mqtt.py"]
    restart: unless-stopped
    environment:
      HCPY_DEVICES_FILE: /app/config/devices.json
      HCPY_MQTT_HOST: 192.168.4.172
      HCPY_MQTT_PORT: "1883"
      HCPY_MQTT_PREFIX: bosch_local/
      HCPY_MQTT_CLIENTNAME: bosch_sms6_monitor
      HCPY_MQTT_USERNAME: mqtt
      HCPY_MQTT_PASSWORD: ${HCPY_MQTT_PASSWORD:?Set HCPY_MQTT_PASSWORD in .env}
      HCPY_HA_DISCOVERY: "true"
      HCPY_DISCOVERY_FILE: /app/discovery.yaml
    volumes:
      - ./config:/app/config:ro
networks: {}
